<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Budget Tracker</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Budget Tracker">

    <!-- External Web Manifest Reference -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Alpine.js for reactive UI -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* Gray Touch Scrollbar Indicator */
        .chart-scrollbar {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch !important;
            touch-action: pan-x !important;
            scrollbar-width: thin;
            scrollbar-color: #475569 #1e293b;
        }
        .chart-scrollbar::-webkit-scrollbar {
            height: 6px !important;
            display: block !important;
        }
        .chart-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 9999px;
        }
        .chart-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 9999px;
        }
        .chart-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col justify-between select-none" x-data="expenseApp()">

    <!-- Header Section -->
    <header class="sticky top-0 pt-10 pb-4 px-6 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80 flex justify-between items-center z-30">
        <div>
            <div class="flex items-center space-x-2.5">
                <span class="bg-emerald-500/20 text-emerald-400 w-8 h-8 rounded-xl text-xs font-bold flex items-center justify-center border border-emerald-500/30">$</span>
                <h1 class="text-xl font-bold tracking-tight text-white">Budget Tracker</h1>
            </div>
        </div>
        <button @click="openAddModal()" class="w-10 h-10 rounded-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 flex items-center justify-center font-bold shadow-lg shadow-emerald-500/20 transition-all transform active:scale-95">
            <i class="fa-solid fa-plus"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-md mx-auto pb-24 px-4 pt-4">
        
        <!-- TAB 1: OVERVIEW -->
        <div x-show="activeTab === 'overview'" class="space-y-6" x-transition:enter="transition ease-out duration-200">
            
            <!-- Monthly Summary Card -->
            <div class="bg-slate-900 border border-emerald-500/40 rounded-3xl p-6 relative overflow-hidden shadow-xl">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Current Month Total</span>
                    <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full font-medium" x-text="currentMonthLabel"></span>
                </div>
                <div class="text-3xl font-extrabold text-white tracking-tight mb-2" x-text="formatCAD(currentMonthTotalCAD)"></div>
                <div class="text-xs text-slate-400">
                    Total transactions: <span class="font-bold text-slate-200" x-text="currentMonthCADCount"></span>
                </div>
            </div>

            <!-- Monthly Spending Trend Bar Chart (Horizontal Touch Scroll) -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Monthly Spending Trend</h3>
                </div>

                <!-- Touch Scrollable Chart Container -->
                <div class="chart-scrollbar w-full pb-3">
                    <div class="h-44 flex items-end space-x-6 pt-6 px-3 w-max min-w-full">
                        <template x-for="bar in monthlyStats" :key="bar.yearMonth">
                            <div class="w-12 flex flex-col items-center group relative">
                                <!-- Amount Label Above Bar -->
                                <span class="text-[10px] text-slate-400 font-semibold mb-1 whitespace-nowrap" x-text="'$' + Math.round(bar.total)"></span>
                                
                                <!-- Bar Track Container -->
                                <div class="w-7 bg-slate-800/80 rounded-t-md relative flex items-end justify-center h-28">
                                    <!-- Solid Green Bar -->
                                    <div class="w-full bg-emerald-500 hover:bg-emerald-400 rounded-t-md transition-all duration-300"
                                         :style="`height: ${Math.max(bar.heightPercent, 4)}%;`">
                                    </div>
                                </div>
                                
                                <!-- Month Label -->
                                <span class="text-[10px] text-slate-400 mt-2 font-medium whitespace-nowrap" x-text="bar.monthLabel"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Quick Stats Header -->
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Recent Activity</h2>
                <button @click="activeTab = 'expenses'" class="text-xs text-emerald-400 hover:underline font-semibold">View All</button>
            </div>

            <!-- Recent Expenses List -->
            <div class="space-y-3">
                <template x-for="item in recentExpenses" :key="item.id">
                    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-emerald-400 text-sm font-bold">
                                $
                            </div>
                            <div>
                                <h4 class="text-sm font-semibold text-white line-clamp-1" x-text="item.description"></h4>
                                <span class="text-[11px] text-slate-400" x-text="formatDate(item.date)"></span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-bold text-emerald-400" x-text="formatCAD(item.amount)"></span>
                        </div>
                    </div>
                </template>
                <div x-show="expenses.length === 0" class="text-center py-10 text-slate-500 text-xs">
                    No expenses recorded yet. Tap '+' to add one!
                </div>
            </div>
        </div>

        <!-- TAB 2: EXPENSES -->
        <div x-show="activeTab === 'expenses'" class="space-y-4" x-transition:enter="transition ease-out duration-200" style="display: none;">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">All Expenses</h2>
            </div>

            <!-- Search Field -->
            <div class="relative">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-500 text-xs"></i>
                <input type="text" x-model="searchQuery" placeholder="Search description..." 
                       class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Full Expenses List -->
            <div class="space-y-3">
                <template x-for="item in filteredExpenses" :key="item.id">
                    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-emerald-400 text-sm font-bold">
                                $
                            </div>
                            <div>
                                <h4 class="text-sm font-semibold text-white" x-text="item.description"></h4>
                                <span class="text-[11px] text-slate-400" x-text="formatDate(item.date)"></span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="text-right">
                                <span class="text-sm font-bold text-emerald-400" x-text="formatCAD(item.amount)"></span>
                            </div>
                            <button @click="deleteExpense(item.id)" class="text-slate-600 hover:text-rose-400 p-1 transition-colors">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                </template>
                <div x-show="filteredExpenses.length === 0" class="text-center py-12 text-slate-500 text-xs">
                    No matching transactions found.
                </div>
            </div>
        </div>

        <!-- TAB 3: SETTINGS -->
        <div x-show="activeTab === 'settings'" class="space-y-6" x-transition:enter="transition ease-out duration-200" style="display: none;">
            <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Settings & Data Controls</h2>
            
            <div class="space-y-3">
                <button @click="exportCSV()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl text-xs transition-all flex items-center justify-center space-x-2 shadow-lg shadow-emerald-500/10">
                    <i class="fa-solid fa-file-csv text-sm"></i>
                    <span>Export CSV Sheet (Download)</span>
                </button>
                <button @click="syncFromSheet()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 px-4 rounded-xl text-xs transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span>Sync with Google Sheet Now</span>
                </button>
                <button @click="seedDemoData()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 px-4 rounded-xl text-xs transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Load Sample Data</span>
                </button>
                <button @click="clearAllData()" class="w-full bg-rose-950/40 border border-rose-900/50 hover:bg-rose-900/50 text-rose-300 font-medium py-2.5 px-4 rounded-xl text-xs transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Clear All Transactions</span>
                </button>
            </div>
        </div>

    </main>

    <!-- ADD EXPENSE MODAL -->
    <div x-show="showModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" x-transition.opacity style="display: none;">
        <div class="w-full sm:max-w-sm bg-slate-900 border border-slate-800 rounded-t-[32px] sm:rounded-3xl p-6 space-y-4 shadow-2xl" @click.away="closeAddModal()">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <h3 class="text-sm font-bold text-white">Add New Expense</h3>
                <button @click="closeAddModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form @submit.prevent="saveExpense()" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Description / Merchant</label>
                    <input type="text" x-model="form.description" required placeholder="e.g., Tim Hortons Coffee"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Amount</label>
                    <input type="number" step="0.01" x-model="form.amount" required placeholder="0.00"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Date & Time</label>
                    <input type="datetime-local" x-model="form.date" required
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-500/10">
                    Save Transaction
                </button>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div x-show="toast.show" x-transition class="fixed top-12 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-full shadow-xl z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span x-text="toast.message"></span>
    </div>

    <!-- Bottom Mobile Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-md border-t border-slate-800/80 px-6 pb-6 pt-3 flex justify-around items-center z-30">
        <button @click="activeTab = 'overview'" class="flex flex-col items-center space-y-1 transition-colors" :class="activeTab === 'overview' ? 'text-emerald-400' : 'text-slate-500 hover:text-slate-300'">
            <i class="fa-solid fa-chart-pie text-base"></i>
            <span class="text-[10px] font-medium">Overview</span>
        </button>
        <button @click="activeTab = 'expenses'" class="flex flex-col items-center space-y-1 transition-colors" :class="activeTab === 'expenses' ? 'text-emerald-400' : 'text-slate-500 hover:text-slate-300'">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] font-medium">Expenses</span>
        </button>
        <button @click="activeTab = 'settings'" class="flex flex-col items-center space-y-1 transition-colors" :class="activeTab === 'settings' ? 'text-emerald-400' : 'text-slate-500 hover:text-slate-300'">
            <i class="fa-solid fa-gear text-base"></i>
            <span class="text-[10px] font-medium">Settings</span>
        </button>
    </nav>

    <script>
        function expenseApp() {
            return {
                activeTab: 'overview',
                showModal: false,
                searchQuery: '',
                toast: { show: false, message: '' },
                
                gasUrl: '',

                form: {
                    description: '',
                    amount: '',
                    date: new Date().toISOString().slice(0, 16)
                },

                expenses: [
                    { id: 1, description: 'Supermarket Grocery', amount: 85.80, date: '2026-11-02T14:30' },
                    { id: 2, description: 'Tim Hortons Coffee', amount: 4.85, date: '2026-11-01T08:15' },
                    { id: 3, description: 'Compass Pass Refill', amount: 120.00, date: '2026-10-15T09:00' },
                    { id: 4, description: 'Superstore Supplies', amount: 145.30, date: '2026-10-05T18:20' }
                ],

                init() {
                    const saved = localStorage.getItem('budget_tracker_expenses');
                    if (saved) {
                        try { this.expenses = JSON.parse(saved); } catch (e) {}
                    }
                    this.registerServiceWorker();
                    this.syncFromSheet();
                },

                registerServiceWorker() {
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.register('sw.js').catch(err => {
                            console.log('SW registration skipped or failed');
                        });
                    }
                },

                async syncFromSheet() {
                    if (!this.gasUrl) return;
                    try {
                        const res = await fetch(this.gasUrl);
                        if (res.ok) {
                            const fetchedExpenses = await res.json();
                            if (Array.isArray(fetchedExpenses) && fetchedExpenses.length > 0) {
                                this.expenses = fetchedExpenses;
                                this.saveToStorage();
                                this.showToast('Synced with Sheet!');
                            }
                        }
                    } catch (err) {
                        console.log('Sync skipped or offline mode.');
                    }
                },

                saveToStorage() {
                    localStorage.setItem('budget_tracker_expenses', JSON.stringify(this.expenses));
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.show = true;
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                openAddModal() {
                    this.form = {
                        description: '',
                        amount: '',
                        date: new Date().toISOString().slice(0, 16)
                    };
                    this.showModal = true;
                },

                closeAddModal() {
                    this.showModal = false;
                },

                saveExpense() {
                    if (!this.form.description || !this.form.amount) return;
                    
                    const newEntry = {
                        id: Date.now(),
                        description: this.form.description,
                        amount: parseFloat(this.form.amount),
                        date: this.form.date
                    };

                    this.expenses.unshift(newEntry);
                    this.saveToStorage();
                    this.closeAddModal();
                    this.showToast('Expense recorded successfully!');
                },

                deleteExpense(id) {
                    this.expenses = this.expenses.filter(item => item.id !== id);
                    this.saveToStorage();
                    this.showToast('Transaction removed');
                },

                seedDemoData() {
                    this.expenses = [
                        { id: 101, description: 'Supermarket Grocery', amount: 64.20, date: '2026-11-02T16:00' },
                        { id: 102, description: 'Gas Station Fuel', amount: 55.00, date: '2026-11-01T12:30' },
                        { id: 103, description: 'Online Subscription', amount: 14.99, date: '2026-10-30T21:00' },
                        { id: 104, description: 'Coffee & Snack', amount: 12.50, date: '2026-09-15T14:00' }
                    ];
                    this.saveToStorage();
                    this.showToast('Sample data loaded!');
                },

                clearAllData() {
                    this.expenses = [];
                    this.saveToStorage();
                    this.showToast('All transactions cleared');
                },

                exportCSV() {
                    if (this.expenses.length === 0) {
                        this.showToast('No data to export!');
                        return;
                    }
                    let csv = '\uFEFFDate,Description,Amount\n';
                    this.expenses.forEach(e => {
                        csv += `"${e.date}","${e.description.replace(/"/g, '""')}",${e.amount}\n`;
                    });
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.setAttribute('href', url);
                    link.setAttribute('download', `Expenses_Export_${new Date().toISOString().slice(0, 10)}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    this.showToast('CSV downloaded successfully!');
                },

                formatCAD(val) {
                    return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                },

                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const d = new Date(dateStr);
                    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                },

                get currentMonthLabel() {
                    const now = new Date();
                    return now.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
                },

                get currentMonthTotalCAD() {
                    const now = new Date();
                    const currentYearMonth = now.toISOString().slice(0, 7);
                    return this.expenses
                        .filter(item => item.date && item.date.startsWith(currentYearMonth))
                        .reduce((sum, item) => sum + Number(item.amount), 0);
                },

                get currentMonthCADCount() {
                    const now = new Date();
                    const currentYearMonth = now.toISOString().slice(0, 7);
                    return this.expenses.filter(item => item.date && item.date.startsWith(currentYearMonth)).length;
                },

                get monthlyStats() {
                    const monthlyTotals = {};
                    this.expenses.forEach(e => {
                        if (!e.date) return;
                        const ym = e.date.substring(0, 7);
                        monthlyTotals[ym] = (monthlyTotals[ym] || 0) + Number(e.amount);
                    });

                    const sortedYM = Object.keys(monthlyTotals).sort();
                    if (sortedYM.length === 0) {
                        const nowYM = new Date().toISOString().slice(0, 7);
                        return [{ yearMonth: nowYM, monthLabel: 'Current', total: 0, heightPercent: 0 }];
                    }

                    const totalsArray = sortedYM.map(ym => monthlyTotals[ym]);

                    let scaleTarget = 1;
                    if (totalsArray.length > 2) {
                        const sortedTotals = [...totalsArray].sort((a, b) => a - b);
                        const trimmed = sortedTotals.slice(1, -1);
                        const avg = trimmed.reduce((sum, val) => sum + val, 0) / trimmed.length;
                        scaleTarget = avg || 1;
                    } else {
                        const avg = totalsArray.reduce((sum, val) => sum + val, 0) / totalsArray.length;
                        scaleTarget = avg || 1;
                    }

                    return sortedYM.map(ym => {
                        const dateParts = ym.split('-');
                        const dateObj = new Date(dateParts[0], dateParts[1] - 1, 1);
                        const monthLabel = dateObj.toLocaleDateString('en-US', { month: 'short' });
                        const total = monthlyTotals[ym];
                        return {
                            yearMonth: ym,
                            monthLabel: `${monthLabel} '${ym.slice(2, 4)}`,
                            total: total,
                            heightPercent: Math.min((total / scaleTarget) * 100, 100)
                        };
                    });
                },

                get filteredExpenses() {
                    return this.expenses.filter(item => {
                        if (this.searchQuery && !item.description.toLowerCase().includes(this.searchQuery.toLowerCase())) return false;
                        return true;
                    });
                },

                get recentExpenses() {
                    return this.expenses.slice(0, 5);
                }
            }
        }
    </script>
</body>
</html>
